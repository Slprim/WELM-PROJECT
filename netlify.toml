# Netlify deploy config.
#
# The Astro app lives in web/ while the legacy static site stays at the repo
# root as a reference, so `base` points Netlify at the subdirectory.
#
# Deploy previews give the client a real URL to review before anything is
# promoted to production — which is the point of the Phase 1 sign-off gate.

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for fingerprinted assets. Astro hashes everything in
# _astro/, so these can never go stale.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
